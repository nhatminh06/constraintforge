research_question = "Under equal total GPU search-measurement effort, how closely do resource-aware adaptive and seeded-random search select the candidate with the lowest independently measured empirical-reference latency across two prespecified MatMul regimes and two distinct-candidate limits on one Apple M5/Metal system?"
hardware_target = "Apple M5 Metal with GPU timestamp queries"
candidate_space = "m5-tiled-matmul-ten-v1"
measurement = "GPU compute-pass timestamps; host timing is cost only"
ordering = "deterministic rotated/reversed search order; three independently rotated candidate-reference blocks"
primary_estimand = "paired session-level difference in relative empirical-reference regret, resource-aware minus random, within workload and budget"
reference_aggregation = "median of all 30 finite positive timestamps for a candidate; fixed 10/20/30 chronological prefixes are sensitivity summaries"
relative_regret = "(selected candidate 30-sample reference median - minimum candidate 30-sample reference median) / minimum candidate 30-sample reference median"
tie_rule = "exactly equal finite medians share average rank and empirical-best membership; lexicographically smallest candidate ID is the deterministic designated best"
invalid_rule = "non-finite or non-positive samples invalidate the candidate reference record; no imputation, replacement, or outcome-dependent deletion"
missing_rule = "a missing, failed, extra, or duplicate candidate makes the session/workload reference panel incomplete and regret unavailable"
selection_mismatch_rule = "a selected candidate absent from the sealed ten-candidate pool or reference panel invalidates the matched condition"
dependence = "one post-seal reference panel is shared by both policies and budgets within a session/workload; shared denominators are not independent observations"
stop_rules = "preserve all durable records; stop on source/protocol/hardware/correctness/timestamp/persistence mismatch or component wall cap; never replace a failed session"
